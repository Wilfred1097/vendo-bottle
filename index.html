<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoPaper - Secure Login</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary-bg: #f8fafc;
    --sidebar-bg: #0f172a;
    --card-bg: #ffffff;
    --text-main: #334155;
    --text-muted: #64748b;
    --accent-green: #10b981;
}

body {
    background: var(--primary-bg);
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
}

/* LOGIN SCREEN STYLING */
#loginScreen {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    width: 100%;
    max-width: 420px;
    padding: 2.5rem;
}
</style>
</head>
<body>

<div id="loginScreen">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="display-5 text-success mb-2"><i class="fa-solid fa-recycle"></i></div>
            <h3 class="fw-bold text-dark">EcoPaper Portal</h3>
            <p class="text-muted small">Sign in to access the Smart Recycling IoT Dashboard</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" id="loginUser" class="form-control bg-light border-start-0" placeholder="Enter username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" id="loginPass" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <div id="loginError" class="alert alert-danger py-2 small d-none mb-3">
                Invalid credentials. Please try again.
            </div>

            <button type="submit" id="loginBtn" class="btn btn-success w-100 py-2 fw-semibold shadow-sm">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Secure Login
            </button>
        </form>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const TOKEN = "k2Spr2pbMXXdhD3jbGlbeQuS6KwatlpD";

window.addEventListener("DOMContentLoaded", () => {
    const authToken = localStorage.getItem("ecopaper_auth_token");
    if (authToken) {
        // Already logged in -> restrict visiting login.html, redirect straight to dashboard.html
        window.location.href = "dashboard.html";
    }
});

async function handleLogin(event) {
    event.preventDefault();
    const inputUser = document.getElementById("loginUser").value.trim();
    const inputPass = document.getElementById("loginPass").value.trim();
    const errorDiv = document.getElementById("loginError");
    const loginBtn = document.getElementById("loginBtn");

    errorDiv.classList.add("d-none");
    loginBtn.disabled = true;
    loginBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Verifying...`;

    try {
        const baseUrl = "https://sgp1.blynk.cloud/external/api";

        const [userRes, passRes] = await Promise.all([
            fetch(`${baseUrl}/get?token=${TOKEN}&V2`),
            fetch(`${baseUrl}/get?token=${TOKEN}&V3`)
        ]);

        const serverUser = (await userRes.text()).trim();
        const serverPass = (await passRes.text()).trim();

        if (inputUser === serverUser && inputPass === serverPass) {
            const sessionToken = "ECO_" + Math.random().toString(36).substring(2) + "_" + Date.now();
            localStorage.setItem("ecopaper_auth_token", sessionToken);
            
            // Redirect to dashboard page
            window.location.href = "dashboard.html";
        } else {
            errorDiv.textContent = "Invalid username or password.";
            errorDiv.classList.remove("d-none");
        }
    } catch (e) {
        console.error("Login verification error:", e);
        errorDiv.textContent = "Connection error while verifying credentials.";
        errorDiv.classList.remove("d-none");
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-2"></i> Secure Login`;
    }
}
</script>

</body>
</html>
